name: Feature request
description: A capability phone-use should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, not the feature — what does success look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape (optional)
      description: CLI flag, MCP tool, SDK API — whatever you imagine it looking like.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried (optional)
