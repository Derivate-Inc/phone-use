name: PhoneUseRunner
options:
  bundleIdPrefix: dev.phoneuse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PhoneUseRunner:
    type: application
    platform: iOS
    sources: [PhoneUseRunner]
    info:
      path: PhoneUseRunner/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: phone-use
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phoneuse.runner
  PhoneUseRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhoneUseRunnerUITests]
    dependencies:
      - target: PhoneUseRunner
    info:
      path: PhoneUseRunnerUITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phoneuse.runner.uitests
        SWIFT_OBJC_BRIDGING_HEADER: PhoneUseRunnerUITests/PhoneUseRunnerUITests-Bridging-Header.h
        TEST_TARGET_NAME: PhoneUseRunner
schemes:
  PhoneUseRunnerUITests:
    build:
      targets:
        PhoneUseRunner: all
        PhoneUseRunnerUITests: [test]
    test:
      targets:
        - PhoneUseRunnerUITests
